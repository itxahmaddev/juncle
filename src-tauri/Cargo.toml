[package]
name = "juncle"
version = "1.0.0"
description = "Juncle Cleaning Boost - junk cleaner and system booster"
license = "MIT"
authors = ["Muhammad Ahmad"]
repository = "https://github.com/itxahmaddev/juncle"
edition = "2021"

[lib]
name = "juncle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
winreg = "0.56"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
