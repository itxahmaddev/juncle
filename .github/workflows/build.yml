name: "Build"

# Reusable build workflow (like Yap's). Called by main-build, pr-test-build,
# build-test and release. Builds the Windows installer with tauri-action.

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "juncle"
      upload-artifacts:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      no-cache:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Rust cache
        # Releases always compile from scratch (no-cache: true); PR and test
        # builds keep the cache for speed.
        if: ${{ !inputs.no-cache }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}
          cache-bin: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          releaseId: ${{ inputs.release-id }}
          args: ${{ inputs.build-args }}

      - name: Rename installer
        if: ${{ inputs.upload-artifacts }}
        shell: bash
        run: |
          mkdir -p dist-artifacts
          for f in src-tauri/target/**/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            cp "$f" "dist-artifacts/${{ inputs.asset-prefix }}_${{ steps.get-version.outputs.version }}_${{ inputs.target }}-setup.exe"
          done
          ls -la dist-artifacts

      - name: Upload installer artifact
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: dist-artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
