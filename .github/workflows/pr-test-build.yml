name: "PR Test Build"

# Maintainer-triggered build of a pull request, with a comment linking the artifacts.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
        type: string

jobs:
  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "windows-11-arm"
            target: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "juncle-pr-${{ inputs.pr_number }}"
      upload-artifacts: true
      ref: ${{ format('refs/pull/{0}/merge', inputs.pr_number) }}
    secrets: inherit

  comment-on-pr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `## Test build ready\n\nInstallers for PR #${{ inputs.pr_number }} are available for testing.\n\n**[Download artifacts from the workflow run](${runUrl})**\n\nArtifacts expire after 30 days.`
            });
