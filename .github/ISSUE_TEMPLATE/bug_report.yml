name: Bug report
description: Something isn't working
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/itxahmaddev/juncle/issues) first to avoid duplicates.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Juncle version
      description: Shown on the About page.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      description: e.g. Windows 11 23H2
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      options: ["x64", "ARM64"]
  - type: dropdown
    id: admin
    attributes:
      label: Running as Administrator?
      options: ["Yes", "No"]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
